<main class="shell">
  <header class="hero">
    <div>
      <p class="eyebrow">OTA LINK RESOLVER</p>
      <h1>OTA 包链接解析器</h1>
      <p class="lead">按包类型、品牌、系列、机型和版本逐级选择，优先命中自有 API 固定缓存，再生成可用的固件包下载地址。</p>
    </div>
    <button id="docs-btn" class="ghost" type="button">查看 API 文档</button>
  </header>

  <section class="panel search-panel">
    <div class="section-title">
      <div><span>01</span><h2>选择 OTA 条件</h2></div>
      <small id="archive-state">第三方目录加载中…</small>
    </div>

    <div class="mode-switch" role="group" aria-label="查询方式">
      <button id="catalog-mode-btn" class="mode-btn active" type="button">目录选择</button>
      <button id="manual-mode-btn" class="mode-btn" type="button">手动输入兜底</button>
    </div>

    <div id="catalog-fields" class="fields catalog-fields">
      <label>包类型
        <select id="package-type"><option value="">正在准备包类型…</option></select>
      </label>
      <label>品牌
        <select id="brand" disabled><option value="">请先选择包类型</option></select>
      </label>
      <label>系列
        <select id="series" disabled><option value="">请先选择品牌</option></select>
      </label>
      <label>机型
        <select id="device" disabled><option value="">请先选择系列</option></select>
      </label>
      <label>固件版本
        <select id="version" disabled><option value="">请先选择机型</option></select>
      </label>
    </div>

    <div id="catalog-actions" class="actions">
      <button id="resolve-btn" class="primary" type="button" disabled>解析下载链接</button>
      <button id="clear-btn" type="button">重置选择</button>
      <button id="reload-btn" type="button">重新加载目录</button>
    </div>

    <div id="manual-fields" class="manual-section" hidden>
      <div class="fields manual-fields">
        <label>包类型
          <select id="manual-package-type">
            <option value="full">全量包</option>
            <option value="afterSales">售后包</option>
          </select>
        </label>
        <label>品牌<input id="manual-brand" type="text" placeholder="例如：OnePlus" autocomplete="off" spellcheck="false"></label>
        <label>系列<input id="manual-series" type="text" placeholder="例如：数字系列" autocomplete="off" spellcheck="false"></label>
        <label>机型<input id="manual-device" type="text" placeholder="例如：[普通]一加9" autocomplete="off" spellcheck="false"></label>
        <label>固件版本<input id="manual-version" type="text" placeholder="例如：ColorOS 11.2 A.03" autocomplete="off" spellcheck="false"></label>
      </div>
    </div>

    <div id="manual-actions" class="actions" hidden>
      <button id="manual-resolve-btn" class="primary" type="button">解析下载链接</button>
      <button id="manual-clear-btn" type="button">清空手动条件</button>
    </div>
    <p id="status" class="status">请选择包类型。</p>
  </section>

  <section class="results-section">
    <div class="section-title">
      <div><span>02</span><h2>解析结果</h2></div>
      <small>固定链接优先；动态签名链接可能随时间过期</small>
    </div>
    <div id="results" class="results">
      <div class="empty"><b>尚未解析版本</b><span>从上方目录选择，或切换到手动输入兜底。</span></div>
    </div>
  </section>

  <template id="release-template">
    <article class="release-card">
      <div class="release-head">
        <div><span class="device"></span><span class="brand"></span><span class="series"></span></div>
        <span class="package-type-value badge"></span>
      </div>
      <h3 class="version"></h3>
      <dl class="result-meta">
        <div><dt>来源</dt><dd class="source-value"></dd></div>
        <div><dt>传输安全</dt><dd class="security-value"></dd></div>
        <div><dt>动态签名</dt><dd class="dynamic-value"></dd></div>
      </dl>
      <div class="link-box">
        <span class="link-label">下载链接</span>
        <code class="download-url"></code>
        <small class="resolve-note"></small>
      </div>
      <div class="card-actions">
        <button class="copy-btn primary" type="button">复制下载链接</button>
      </div>
    </article>
  </template>
</main>
